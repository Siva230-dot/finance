<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>A heritage study: open ledger, fountain pen and inkwell in warm window light</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3326"/><stop offset=".55" stop-color="#2a2a20"/><stop offset="1" stop-color="#1b211b"/></linearGradient>
    <radialGradient id="glow" cx=".18" cy=".22" r=".75"><stop offset="0" stop-color="#f6dfa6" stop-opacity=".55"/><stop offset=".45" stop-color="#c79a52" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b3f28"/><stop offset=".5" stop-color="#47301e"/><stop offset="1" stop-color="#2a1c12"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9dcc0"/><stop offset=".48" stop-color="#f6eedb"/><stop offset=".5" stop-color="#d8c8a6"/><stop offset=".52" stop-color="#f4ead4"/><stop offset="1" stop-color="#e4d5b6"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe7b5" stop-opacity=".35"/><stop offset="1" stop-color="#fbe7b5" stop-opacity="0"/></linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e1a13"/><stop offset=".5" stop-color="#2d4636"/><stop offset="1" stop-color="#0c140f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d590"/><stop offset=".5" stop-color="#b08a45"/><stop offset="1" stop-color="#7a5c28"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e4a37"/><stop offset="1" stop-color="#1a2b20"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .22 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b0805" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <!-- wainscot panels -->
  <g opacity=".35" stroke="#7a6443" fill="none" stroke-width="2">
    <rect x="980" y="120" width="230" height="330" rx="4"/><rect x="1240" y="120" width="230" height="330" rx="4"/>
    <rect x="995" y="135" width="200" height="300" rx="3" opacity=".6"/><rect x="1255" y="135" width="200" height="300" rx="3" opacity=".6"/>
  </g>
  <!-- arched window -->
  <g>
    <path d="M110 560 V250 a200 200 0 0 1 400 0 V560 Z" fill="#f3dfae" opacity=".92"/>
    <path d="M110 560 V250 a200 200 0 0 1 400 0 V560 Z" fill="url(#glow)"/>
    <g stroke="#2b261d" stroke-width="14" fill="none"><path d="M110 560 V250 a200 200 0 0 1 400 0 V560 Z"/><line x1="310" y1="50" x2="310" y2="560"/><line x1="110" y1="330" x2="510" y2="330"/><line x1="110" y1="450" x2="510" y2="450"/></g>
    <path d="M140 330 q60 -60 140 -40 q60 15 120 -30 q50 -30 90 10 V330 Z" fill="#b8c2a2" opacity=".35"/>
  </g>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- light beams -->
  <polygon points="140,560 500,560 1180,1000 380,1000" fill="url(#beam)" filter="url(#soft)"/>
  <!-- bookshelf silhouette right -->
  <g opacity=".75">
    <rect x="1500" y="40" width="100" height="600" fill="#20180f"/>
    <g fill="#5c3b22"><rect x="1508" y="80" width="18" height="120"/><rect x="1530" y="95" width="14" height="105"/><rect x="1548" y="70" width="20" height="130"/><rect x="1572" y="90" width="16" height="110"/></g>
    <g fill="#2f4a38"><rect x="1508" y="260" width="16" height="130"/><rect x="1528" y="275" width="20" height="115"/><rect x="1552" y="255" width="14" height="135"/></g>
    <g fill="#a58b58" opacity=".7"><rect x="1508" y="120" width="18" height="3"/><rect x="1548" y="110" width="20" height="3"/><rect x="1528" y="320" width="20" height="3"/></g>
  </g>
  <!-- desk -->
  <path d="M0 640 L1600 600 L1600 1000 L0 1000 Z" fill="url(#desk)"/>
  <path d="M0 640 L1600 600" stroke="#8a6440" stroke-width="3" opacity=".7"/>
  <g opacity=".18" stroke="#1a0f08" stroke-width="2" fill="none">
    <path d="M0 700 C400 690 900 680 1600 660"/><path d="M0 780 C500 760 1000 760 1600 730"/><path d="M0 880 C450 860 1100 850 1600 820"/>
  </g>
  <!-- green leather blotter -->
  <path d="M330 690 L1370 655 L1430 960 L250 990 Z" fill="url(#leather)" filter="url(#shadow)"/>
  <path d="M350 702 L1355 668 L1410 945 L272 975 Z" fill="none" stroke="#a58b58" stroke-opacity=".55" stroke-width="2"/>
  <!-- books stack -->
  <g filter="url(#shadow)">
    <rect x="1180" y="520" width="300" height="46" rx="4" fill="#4a2f1d"/><rect x="1180" y="520" width="300" height="8" fill="#6a4a2e"/>
    <rect x="1200" y="476" width="270" height="44" rx="4" fill="#25382d"/><rect x="1200" y="476" width="270" height="7" fill="#355244"/>
    <rect x="1192" y="436" width="285" height="40" rx="4" fill="#6b2f26"/><rect x="1192" y="436" width="285" height="6" fill="#86433a"/>
    <g fill="url(#gold)"><rect x="1250" y="539" width="90" height="3"/><rect x="1260" y="494" width="70" height="3"/><rect x="1240" y="452" width="80" height="3"/></g>
  </g>
  <!-- open ledger -->
  <g filter="url(#shadow)" transform="rotate(-3 820 800)">
    <path d="M470 700 Q820 670 820 700 Q820 670 1170 700 L1190 930 Q820 900 820 935 Q820 900 450 930 Z" fill="#3b2a1b"/>
    <path d="M485 705 Q820 678 820 708 L820 925 Q650 895 465 920 Z" fill="url(#page)"/>
    <path d="M820 708 Q820 678 1155 705 L1175 920 Q990 895 820 925 Z" fill="url(#page)"/>
    <g stroke="#a58b58" stroke-opacity=".55" stroke-width="1.4">
      <line x1="500" y1="745" x2="800" y2="738"/><line x1="498" y1="770" x2="800" y2="764"/><line x1="496" y1="795" x2="800" y2="790"/><line x1="494" y1="820" x2="800" y2="816"/><line x1="492" y1="845" x2="800" y2="842"/><line x1="490" y1="870" x2="800" y2="868"/><line x1="488" y1="895" x2="800" y2="894"/>
      <line x1="840" y1="738" x2="1140" y2="745"/><line x1="840" y1="764" x2="1142" y2="770"/><line x1="840" y1="790" x2="1144" y2="795"/><line x1="840" y1="816" x2="1146" y2="820"/><line x1="840" y1="842" x2="1148" y2="845"/><line x1="840" y1="868" x2="1150" y2="870"/><line x1="840" y1="894" x2="1152" y2="895"/>
    </g>
    <g stroke="#9b3b2f" stroke-opacity=".5" stroke-width="1.2"><line x1="700" y1="725" x2="706" y2="905"/><line x1="1050" y1="725" x2="1056" y2="905"/></g>
    <g fill="#2a2a20" opacity=".72" font-family="Georgia, serif" font-style="italic" font-size="17">
      <text x="510" y="733">Ledger — November</text>
      <text x="510" y="760">Salary</text><text x="716" y="758">85,000</text>
      <text x="508" y="785">Rent</text><text x="716" y="783">22,000</text>
      <text x="506" y="810">Groceries</text><text x="722" y="808">6,240</text>
      <text x="504" y="835">Transport</text><text x="722" y="833">2,180</text>
      <text x="502" y="860">Savings</text><text x="716" y="858">20,000</text>
      <text x="850" y="760">Goal: Laptop</text><text x="1062" y="762">60,000</text>
      <text x="850" y="786">Saved</text><text x="1062" y="788">25,000</text>
      <text x="850" y="812">Monthly</text><text x="1070" y="814">5,000</text>
    </g>
    <path d="M512 880 q30 -14 60 0 t60 0" stroke="#25382d" stroke-width="2" fill="none" opacity=".6"/>
  </g>
  <!-- fountain pen -->
  <g filter="url(#shadow)" transform="rotate(-24 1000 820)">
    <rect x="880" y="808" width="300" height="26" rx="13" fill="url(#pen)"/>
    <rect x="1050" y="806" width="16" height="30" rx="3" fill="url(#gold)"/>
    <rect x="1170" y="811" width="24" height="20" rx="9" fill="url(#gold)"/>
    <path d="M880 808 L830 821 L880 834 Z" fill="url(#gold)"/>
    <path d="M830 821 L800 821" stroke="#b08a45" stroke-width="2"/>
    <line x1="900" y1="815" x2="1040" y2="815" stroke="#ffffff" stroke-opacity=".18" stroke-width="3"/>
  </g>
  <!-- inkwell -->
  <g filter="url(#shadow)">
    <ellipse cx="380" cy="770" rx="72" ry="16" fill="#0f0d0a" opacity=".5"/>
    <path d="M318 700 Q318 770 380 772 Q442 770 442 700 Z" fill="#1d2a22"/>
    <rect x="352" y="672" width="56" height="30" rx="6" fill="url(#gold)"/>
    <ellipse cx="380" cy="672" rx="28" ry="6" fill="#e9cf8a"/>
    <path d="M330 712 Q334 750 360 760" stroke="#ffffff" stroke-opacity=".2" stroke-width="5" fill="none"/>
  </g>
  <!-- coins -->
  <g filter="url(#shadow)"><ellipse cx="1300" cy="880" rx="40" ry="12" fill="url(#gold)"/><ellipse cx="1300" cy="872" rx="40" ry="12" fill="#c9a660"/><ellipse cx="1338" cy="900" rx="34" ry="10" fill="url(#gold)"/></g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".5"/>
  <rect width="1600" height="1000" fill="url(#glow)" opacity=".4"/>
</svg>
