<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <title>A walnut desk from above with leather notebook, brass compass and coins</title>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3322"/><stop offset=".5" stop-color="#5e412a"/><stop offset="1" stop-color="#3a271a"/></linearGradient>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f4c3a"/><stop offset="1" stop-color="#1b2c21"/></linearGradient>
    <radialGradient id="brass" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f6dea0"/><stop offset=".55" stop-color="#b8924c"/><stop offset="1" stop-color="#6f5225"/></radialGradient>
    <radialGradient id="light" cx=".3" cy=".2" r=".9"><stop offset="0" stop-color="#ffe9b8" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="10" dy="16" stdDeviation="14" flood-color="#120a04" flood-opacity=".55"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .18  0 0 0 0 .1  0 0 0 .3 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#wood)"/>
  <g stroke="#2a1a0f" stroke-opacity=".35" fill="none" stroke-width="2">
    <path d="M0 120 C300 100 700 150 1200 110"/><path d="M0 260 C380 240 760 300 1200 250"/><path d="M0 420 C300 400 800 450 1200 410"/><path d="M0 600 C420 580 760 640 1200 590"/><path d="M0 760 C300 740 820 790 1200 750"/>
  </g>
  <!-- notebook -->
  <g filter="url(#sh)" transform="rotate(-8 430 450)">
    <rect x="200" y="190" width="460" height="560" rx="14" fill="url(#nb)"/>
    <rect x="232" y="190" width="10" height="560" fill="#16241b"/>
    <rect x="600" y="190" width="22" height="560" fill="#7a2e26"/>
    <rect x="290" y="300" width="290" height="120" rx="4" fill="none" stroke="#a58b58" stroke-width="2"/>
    <text x="435" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-style="italic" fill="#d8c38f">Budget</text>
    <text x="435" y="392" text-anchor="middle" font-family="Georgia,serif" font-size="16" letter-spacing="6" fill="#a58b58">MMXXVI</text>
  </g>
  <!-- receipt -->
  <g filter="url(#sh)" transform="rotate(10 900 300)">
    <path d="M790 120 h220 v330 l-18 -10 l-18 10 l-18 -10 l-18 10 l-18 -10 l-18 10 l-18 -10 l-18 10 l-18 -10 l-18 10 l-18 -10 l-22 10 Z" fill="#f2e9d6"/>
    <g fill="#5a5444" font-family="Courier New, monospace" font-size="15">
      <text x="815" y="165">GROCER &amp; CO.</text><text x="815" y="205">Rice ......  420</text><text x="815" y="230">Milk ......   64</text><text x="815" y="255">Fruit .....  210</text><text x="815" y="280">Spices ....  148</text>
      <text x="815" y="325">TOTAL ..... 842</text>
    </g>
    <line x1="815" y1="300" x2="985" y2="300" stroke="#5a5444" stroke-dasharray="4 4"/>
  </g>
  <!-- compass -->
  <g filter="url(#sh)">
    <circle cx="900" cy="640" r="130" fill="url(#brass)"/>
    <circle cx="900" cy="640" r="108" fill="#efe4c8"/>
    <circle cx="900" cy="640" r="108" fill="none" stroke="#8f7240" stroke-width="3"/>
    <g stroke="#6b5a3c" stroke-width="2"><line x1="900" y1="540" x2="900" y2="560"/><line x1="900" y1="720" x2="900" y2="740"/><line x1="800" y1="640" x2="820" y2="640"/><line x1="980" y1="640" x2="1000" y2="640"/></g>
    <path d="M900 560 L915 640 L900 720 L885 640 Z" fill="#25382d"/><path d="M900 560 L915 640 L885 640 Z" fill="#9b3b2f"/>
    <circle cx="900" cy="640" r="8" fill="url(#brass)"/>
    <text x="900" y="588" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#4a3d27">N</text>
  </g>
  <!-- coins -->
  <g filter="url(#sh)">
    <circle cx="700" cy="760" r="42" fill="url(#brass)"/><circle cx="700" cy="760" r="32" fill="none" stroke="#7a5c28" stroke-width="2"/>
    <circle cx="640" cy="810" r="34" fill="url(#brass)"/><circle cx="760" cy="826" r="30" fill="url(#brass)"/>
  </g>
  <!-- pen -->
  <g filter="url(#sh)" transform="rotate(62 160 600)"><rect x="40" y="590" width="300" height="22" rx="11" fill="#10180f"/><rect x="230" y="588" width="14" height="26" fill="url(#brass)"/><path d="M40 590 L0 601 L40 612 Z" fill="url(#brass)"/></g>
  <rect width="1200" height="900" fill="url(#light)"/>
  <rect width="1200" height="900" filter="url(#grain)" opacity=".55"/>
</svg>
